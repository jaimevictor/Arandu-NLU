runtime_patterns:
  - rule_id: cldr48.pt.latn-decimal-comma
    class: number
    accepted_shape: "one_or_more_0123456789_digits_optionally_followed_by_one_comma_and_one_or_more_0123456789_digits"
    source_rows:
      - "numberingSystems.xml: <numberingSystem id=\"latn\" type=\"numeric\" digits=\"0123456789\"/>"
      - "pt.xml: <symbols numberSystem=\"latn\"><decimal>,</decimal>"
    explicit_rejections:
      - decimal_period
      - grouping
      - sign
      - exponent
      - non_ASCII_digits
      - repeated_or_edge_comma
  - rule_id: cldr48.pt.hh-mm
    class: time
    accepted_shape: "exactly_two_0123456789_digits_colon_exactly_two_0123456789_digits"
    source_row: "pt.xml: <dateFormatItem id=\"EHm\">E, HH:mm</dateFormatItem>"
    explicit_rejections:
      - one_or_three_digit_hour
      - one_or_three_digit_minute
      - seconds
      - meridiem
      - range_semantics

runtime_precedence:
  - calculate_complete_connector_run
  - exact_literal_only_if_its_suffix_to_the_connector_run_is_admitted_terminal_punctuation
  - bounded_pattern_only_if_its_suffix_to_the_connector_run_is_admitted_terminal_punctuation
  - preserve_every_other_connector_run_as_one_unknown
  - apply_bounded_decimal_and_ASCII_punctuation_rules
  - leave_all_other_Unicode_word_bound_segments_unknown

