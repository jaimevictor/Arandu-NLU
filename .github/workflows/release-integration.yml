name: Attach integration package to published release

'on':
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: integration-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ !github.event.release.prerelease && github.repository == 'jaimevictor/Arandu-NLU' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate tagged version and distribution
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/hacs.py --tag "$RELEASE_TAG"
      - name: Test distribution
        run: |
          python3 -m unittest discover -s tests/mlp -p 'test_distribution.py'
          python3 -m unittest discover -s tests/mlp -p 'test_hacs.py'
      - name: Build and verify reproducible packages
        run: |
          python3 tools/release-package.py --output target/release-assets
          python3 tools/hacs.py --zip target/release-assets/arandu-nlu-integration.zip
          cd target/release-assets
          sha256sum --check arandu-nlu-integration.zip.sha256
      - name: Attach to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" target/release-assets/arandu-nlu-integration.zip target/release-assets/arandu-nlu-integration.zip.sha256
