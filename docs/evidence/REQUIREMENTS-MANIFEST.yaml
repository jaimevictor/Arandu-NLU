required_text:
  USR-001: Do not build or require an external supervisor script.
  USR-004: Obtain public requirements and contract evidence independently.
  USR-008: Use only free and open-source project inputs and dependencies.
  USR-009: Exclude Amazon-specific and Amazon-internal material.
  USR-010: "Limit every phase to three substantive frozen candidate review rounds: one initial round and at most two blocker-remediation rounds."
  USR-011: Require the documented minimum acceptance contract for every phase.
  USR-012: Checkpoint the first minimally acceptable baseline immediately without optional refinement.
  USR-013: Defer eligible P3 improvements instead of extending a phase review loop.
  USR-014: Stop a phase as blocked for explicit user scope adjudication when its round budget is exhausted with a P0 through P2 blocker.
  USR-015: Limit remaining P00 work from 2026-08-26 to the current candidate and at most one blocker-only replacement.
  USR-016: "Permit a deterministic project-authored synthetic PT-BR conformance corpus with labels fixed before NLU implementation, while prohibiting independent-accuracy or Sophia-equivalence claims from it."
